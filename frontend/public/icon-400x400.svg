<svg width="400" height="400" viewBox="0 0 400 400" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Outer Obsidian/Slate App Squircle -->
  <rect x="20" y="20" width="360" height="360" rx="80" fill="#080D1A"/>
  
  <!-- Precision Inner Border Frame (No gradient, crisp flat stroke) -->
  <rect x="20" y="20" width="360" height="360" rx="80" stroke="#1D283A" stroke-width="4"/>
  <rect x="28" y="28" width="344" height="344" rx="72" stroke="#2563EB" stroke-width="5"/>

  <!-- High-Precision Subtle Corner Machine Accents -->
  <path d="M 52 64 L 64 64 L 64 52" stroke="#3B82F6" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" opacity="0.5"/>
  <path d="M 348 64 L 336 64 L 336 52" stroke="#3B82F6" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" opacity="0.5"/>
  <path d="M 52 336 L 64 336 L 64 348" stroke="#3B82F6" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" opacity="0.5"/>
  <path d="M 348 336 L 336 336 L 336 348" stroke="#3B82F6" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" opacity="0.5"/>

  <!-- Top Architectural Horizontal Crossbar ('T' Roof) -->
  <line x1="94" y1="98" x2="306" y2="98" stroke="#F8FAFC" stroke-width="22" stroke-linecap="round"/>

  <!-- Central Vertical Axis ('A' & 'T' Core Spine - anchors cleanly into Step 3) -->
  <line x1="200" y1="98" x2="200" y2="248" stroke="#F8FAFC" stroke-width="22" stroke-linecap="round"/>

  <!-- Reverse-Auction Step 1 (Broad Market Entry) -->
  <line x1="120" y1="150" x2="280" y2="150" stroke="#3B82F6" stroke-width="19" stroke-linecap="round"/>

  <!-- Reverse-Auction Step 2 (Price Undercutting Convergence) -->
  <line x1="148" y1="200" x2="252" y2="200" stroke="#3B82F6" stroke-width="19" stroke-linecap="round"/>

  <!-- Reverse-Auction Step 3 (Lowest Clearing Floor - cleanly caps vertical spine) -->
  <line x1="174" y1="248" x2="226" y2="248" stroke="#3B82F6" stroke-width="19" stroke-linecap="round"/>

  <!-- Sub-Second Deterministic Settlement Point (Arc L1 Atomic Settlement Node) -->
  <circle cx="200" cy="302" r="21" fill="#10B981"/>
  <circle cx="200" cy="302" r="9" fill="#080D1A"/>
  <circle cx="200" cy="302" r="4.5" fill="#34D399"/>
</svg>